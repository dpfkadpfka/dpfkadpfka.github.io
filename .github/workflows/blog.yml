name: 블로그 최근활동 가져오기
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/blog.py
      - run: |
          git config user.name "blog-bot"
          git config user.email "dpfkadpfka@gmail.com"
          git add blog.json
          git diff --cached --quiet || (git commit -m "블로그 최근활동 갱신" && git push)
